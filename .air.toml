# air の設定。go / html / css を保存したら、ビルドし直してサーバを再起動する。
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  # テンプレートと静的ファイルは embed でバイナリに入るため、
  # .html や .css を変えたときもビルドし直す必要がある。
  include_ext = ["go", "html", "css"]
  exclude_dir = ["tmp", ".git", "docs", ".claude"]
  exclude_regex = ["_test\\.go"]
  # 保存が連続したときにビルドを間引く
  delay = 200
  stop_on_error = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
