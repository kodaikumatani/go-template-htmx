<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>{{ .Title }}</title></head>
<body>
  <h1>{{ .Title }}</h1>

  <ul>
    {{ range .Issues }}
      <li>
        {{ if eq .Status "closed" }}<s>{{ .Title }}</s>{{ else }}{{ .Title }}{{ end }}
      </li>
    {{ end }}
  </ul>
</body>
</html>
