{{/* 行 1 つ。3 通りに使われる。
       1. 一覧の中（list.html の range から）
       2. 追加したときのレスポンス（この 1 行だけが返る）
       3. この先のインライン編集でも使う

     id="issue-3" のように行ごとに id を振っておく。
     これが htmx から「この行だけ差し替えて」と指すときの目印になる。 */}}
<li id="issue-{{ .ID }}">
  {{ if eq .Status "closed" }}<s>{{ .Title }}</s>{{ else }}{{ .Title }}{{ end }}
</li>
