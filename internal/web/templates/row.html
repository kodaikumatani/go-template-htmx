{{/* 一覧の中でも、単独のレスポンスでも同じものを使う。
     hx-target:inherited="this" で、中のボタンの行き先はこの <li> 自身になる。 */}}
<li id="issue-{{ .ID }}" class="issue-row"
    hx-target:inherited="this"
    hx-swap:inherited="outerHTML">

  <span class="status status-{{ .Status }}">{{ .Status }}</span>
  <span class="issue-title{{ if eq .Status "closed" }} is-closed{{ end }}">{{ .Title }}</span>

  <button hx-get="/issues/{{ .ID }}/edit">Edit</button>

  {{/* swap:300ms の間だけ .htmx-swapping が付くので、CSS でフェードアウトできる。 */}}
  <button class="btn-danger"
          hx-delete="/issues/{{ .ID }}"
          hx-confirm="Delete &quot;{{ .Title }}&quot;?"
          hx-swap="outerHTML swap:300ms">Delete</button>
</li>
