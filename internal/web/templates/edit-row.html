{{/* row.html と同じ id を持つこと。同じ位置に置き換わって行がフォームに化ける。 */}}
<li id="issue-{{ .ID }}" class="issue-row"
    hx-target:inherited="this"
    hx-swap:inherited="outerHTML">

  <form hx-patch="/issues/{{ .ID }}">
    <input type="text" name="title" value="{{ .Title }}" autofocus>
    <button type="submit">Save</button>
    {{/* キャンセルは元の行をサーバから取り直す。クライアントに元の値を持たない。 */}}
    <button hx-get="/issues/{{ .ID }}" type="button">Cancel</button>
  </form>
</li>
