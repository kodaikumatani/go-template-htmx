{{/* 一覧まるごと。#issue-list ごと返すので hx-swap="outerHTML" で丸ごと差し替わる。
     行の追加先は内側の #issue-rows（件数表示の下に入れたいため）。 */}}
{{ define "issues/list" }}
<div id="issue-list" class="issue-list">
  {{ template "issues/meta" .Meta }}
  <div id="issue-rows">
    {{ range .Issues }}
      {{ template "issues/row" . }}
    {{ end }}
  </div>
</div>
{{ end }}
