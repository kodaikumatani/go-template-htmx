{{/* . は bool。true のとき hx-swap-oob が付き、id で既存のフォームを置き換える
     （= 入力欄のクリア）。初期表示は false、追加成功時のレスポンスは true。 */}}
<form id="new-issue"
      hx-post="/issues"
      hx-target="#issue-list"
      hx-swap="afterbegin"
      {{ if . }}hx-swap-oob="true"{{ end }}>
  <input type="text" name="title" placeholder="新しい Issue のタイトル" autocomplete="off">
  <button type="submit">Add</button>
</form>
